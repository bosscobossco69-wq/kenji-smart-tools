<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Converter - UPPERCASE, lowercase, Title Case Online | KENJI Smart Tools</title>
<meta name="description" content="Convert text to UPPERCASE, lowercase, Title Case, Sentence case or camelCase instantly. Free, no sign-up, runs in your browser.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f6f7fb;color:#1a1d29;line-height:1.6}
header{background:#fff;border-bottom:1px solid #e5e7f0;padding:14px 20px}
header a{color:#4f46e5;text-decoration:none;font-weight:700}
main{max-width:720px;margin:32px auto;padding:0 16px}
h1{font-size:26px;margin-bottom:8px}
.sub{color:#5b6070;margin-bottom:24px}
.card{background:#fff;border:1px solid #e5e7f0;border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 1px 3px rgba(20,20,60,.05)}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d4d8e6;border-radius:8px;font-size:15px}
textarea{min-height:120px;resize:vertical;font-family:inherit}
button{background:#4f46e5;color:#fff;border:none;padding:11px 20px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:16px}
button:hover{background:#4338ca}
.result{background:#f0f1fa;border-radius:8px;padding:14px;margin-top:16px;font-size:16px;word-break:break-word}
.result b{font-size:20px;color:#4f46e5}
.row{display:flex;gap:12px}.row>div{flex:1}
footer{text-align:center;color:#8a8fa3;font-size:13px;padding:24px 16px}
</style>
</head>
<body>
<header><a href="/">KENJI Smart Tools</a></header>
<main>
<h1>Case Converter</h1>
<p class="sub">Convert text between UPPERCASE, lowercase, Title Case, Sentence case and camelCase instantly.</p>

<div class="card">
  <label>Your text</label>
  <textarea id="t" placeholder="Type or paste text here...">hello world, this is a test.</textarea>
  <div class="row" style="margin-top:14px">
    <button onclick="conv('upper')">UPPERCASE</button>
    <button onclick="conv('lower')">lowercase</button>
    <button onclick="conv('title')">Title Case</button>
  </div>
  <div class="row">
    <button onclick="conv('sentence')">Sentence case</button>
    <button onclick="conv('camel')">camelCase</button>
    <button onclick="copy()" style="background:#0e9f6e">Copy result</button>
  </div>
</div>

</main>
<footer>&copy; 2026 KENJI Smart Tools &middot; <a href="/">All tools</a> &middot; Free, no account needed</footer>
<script>
function conv(mode){const t=document.getElementById('t');
 let s=t.value;
 if(mode==='upper')s=s.toUpperCase();
 if(mode==='lower')s=s.toLowerCase();
 if(mode==='title')s=s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
 if(mode==='sentence')s=s.toLowerCase().replace(/(^\s*\w|[.!?]\s+\w)/g,c=>c.toUpperCase());
 if(mode==='camel')s=s.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g,(m,c)=>c.toUpperCase());
 t.value=s;}
function copy(){navigator.clipboard.writeText(document.getElementById('t').value);}
</script>
</body>
</html>
