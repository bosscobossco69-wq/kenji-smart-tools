<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Support tickets | KENJI Admin</title><link rel="stylesheet" href="/assets/kenji-brand-system.css"><style>*{box-sizing:border-box}body{margin:0}main{width:min(900px,calc(100% - 28px));margin:24px auto}.card{padding:20px;border-radius:18px;margin:16px 0;overflow-wrap:anywhere}.ticket-text{white-space:pre-wrap}button{padding:12px;border-radius:10px;cursor:pointer;margin:8px 8px 8px 0}button:disabled{opacity:.55}</style></head><body class="kenji-standalone"><main><a href="/website-admin.html">← Admin dashboard</a><h1>Human support tickets</h1><p>Only the configured verified administrator can access tickets. Guest emails are unverified; verify ownership before changing any account. Do not use this queue for marketing.</p><button id="refresh" type="button">Refresh tickets</button><p id="status" role="status">Checking administrator account…</p><div id="tickets"></div></main><script type="module">
import {auth,authReady,onAuthStateChanged} from "/workspace/firebase-auth.js";
const status=document.getElementById("status"),list=document.getElementById("tickets"),refresh=document.getElementById("refresh");
let user=null,version=0;
function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n;}
async function request(action,id){if(!user?.emailVerified)throw Error("Verified administrator sign-in required.");const r=await fetch("/api/kenji-support",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+await user.getIdToken(true)},body:JSON.stringify({action,id}),cache:"no-store"});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d;}
async function load(){const v=++version;list.replaceChildren();refresh.disabled=true;try{const d=await request("admin_list");if(v!==version)return;status.textContent=d.tickets.length+" recent tickets (maximum 50).";for(const t of d.tickets){const card=el("article");card.className="card";card.append(el("h2",t.status+" · "+t.id),el("p",t.createdAt||""),el("p",t.contact+" · "+(t.verified?"Verified account":"Unverified guest")));const msg=el("p",t.message);msg.className="ticket-text";card.append(msg);if(t.status==="open"){const b=el("button","Mark resolved");b.type="button";b.addEventListener("click",async()=>{b.disabled=true;try{await request("admin_close",t.id);await load();}catch(e){status.textContent=e.message;b.disabled=false;}});card.append(b);}list.append(card);}}catch(e){if(v===version)status.textContent=e.message;}finally{if(v===version)refresh.disabled=false;}}
refresh.addEventListener("click",load);await authReady;onAuthStateChanged(auth,u=>{user=u;version++;list.replaceChildren();if(u?.emailVerified)void load();else status.textContent="Sign in with the verified administrator account.";});
</script></body></html>
