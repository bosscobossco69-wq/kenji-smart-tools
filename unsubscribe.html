<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="dark"><title>Email preferences | KENJI Smart Tools</title><style>
:root{color-scheme:dark;font:16px/1.55 system-ui,-apple-system,sans-serif;background:#09151f;color:#f3e6d2}body{margin:0;padding:24px;display:grid;min-height:100vh;place-items:center}main{width:min(490px,100%);padding:26px;border:1px solid #846747;border-radius:16px;background:#292019}h1{font-size:1.6rem}p{color:#dac8b1}button{background:#e2c18f;border:0;border-radius:10px;padding:14px 20px;font:inherit;font-weight:700;color:#24180e;cursor:pointer}button:disabled{opacity:.6}a{color:#eed3a9}#status{margin-top:18px}</style><link rel="stylesheet" href="/assets/kenji-brand-system.css">
</head><body class="kenji-standalone kenji-single-panel"><main><h1>Unsubscribe from product emails</h1><p>This stops optional KENJI Smart Tools marketing emails. Essential receipts and security messages are not affected.</p><button id="confirm" type="button">Unsubscribe</button><div id="status" role="status" aria-live="polite"></div><p><a href="/">Return to KENJI Smart Tools</a></p></main><script>
const params=new URLSearchParams(location.search),uid=params.get("uid"),signature=params.get("signature");const b=document.getElementById("confirm"),status=document.getElementById("status");
if(!/^[A-Za-z0-9_-]{4,128}$/.test(uid||"")||!/^[a-f0-9]{64}$/.test(signature||"")){b.disabled=true;status.textContent="This link is invalid. You can also turn off marketing emails in Account settings.";}
b.addEventListener("click",async()=>{b.disabled=true;status.textContent="Saving your preference…";try{const r=await fetch("/api/website-order?action=marketing_unsubscribe",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({uid,signature})});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||"Unsubscribe could not be completed.");status.textContent="You are unsubscribed from optional product emails.";b.textContent="Unsubscribed";}catch(e){status.textContent=e.message||"Please try again.";b.disabled=false;}});
</script></body></html>
