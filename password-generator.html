<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator - Strong Random Passwords | KENJI Smart Tools</title>
<meta name="description" content="Generate strong random passwords with custom length and character types. Runs locally in your browser for maximum privacy.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f6f7fb;color:#1a1d29;line-height:1.6}
header{background:#fff;border-bottom:1px solid #e5e7f0;padding:14px 20px}
header a{color:#4f46e5;text-decoration:none;font-weight:700}
main{max-width:720px;margin:32px auto;padding:0 16px}
h1{font-size:26px;margin-bottom:8px}
.sub{color:#5b6070;margin-bottom:24px}
.card{background:#fff;border:1px solid #e5e7f0;border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 1px 3px rgba(20,20,60,.05)}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d4d8e6;border-radius:8px;font-size:15px}
textarea{min-height:120px;resize:vertical;font-family:inherit}
button{background:#4f46e5;color:#fff;border:none;padding:11px 20px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:16px}
button:hover{background:#4338ca}
.result{background:#f0f1fa;border-radius:8px;padding:14px;margin-top:16px;font-size:16px;word-break:break-word}
.result b{font-size:20px;color:#4f46e5}
.row{display:flex;gap:12px}.row>div{flex:1}
footer{text-align:center;color:#8a8fa3;font-size:13px;padding:24px 16px}
</style>
</head>
<body>
<header><a href="/">KENJI Smart Tools</a></header>
<main>
<h1>Password Generator</h1>
<p class="sub">Create strong random passwords. Generated locally in your browser - never sent anywhere.</p>

<div class="card">
  <label>Password length</label>
  <input type="number" id="len" value="16" min="4" max="64">
  <label><input type="checkbox" id="upper" checked style="width:auto"> Uppercase (A-Z)</label>
  <label><input type="checkbox" id="lower" checked style="width:auto"> Lowercase (a-z)</label>
  <label><input type="checkbox" id="digits" checked style="width:auto"> Numbers (0-9)</label>
  <label><input type="checkbox" id="symbols" checked style="width:auto"> Symbols (!@#$)</label>
  <button onclick="gen()">Generate password</button>
  <div class="result" id="out" style="font-family:monospace;font-size:18px">Click generate</div>
  <button onclick="copy()" style="background:#0e9f6e">Copy</button>
</div>

</main>
<footer>&copy; 2026 KENJI Smart Tools &middot; <a href="/">All tools</a> &middot; Free, no account needed</footer>
<script>
function gen(){let chars='';
 if(document.getElementById('upper').checked)chars+='ABCDEFGHJKLMNPQRSTUVWXYZ';
 if(document.getElementById('lower').checked)chars+='abcdefghijkmnopqrstuvwxyz';
 if(document.getElementById('digits').checked)chars+='23456789';
 if(document.getElementById('symbols').checked)chars+='!@#$%&*?';
 if(!chars){document.getElementById('out').textContent='Select at least one option';return;}
 const n=Math.min(64,Math.max(4,+document.getElementById('len').value||16));
 const arr=new Uint32Array(n);crypto.getRandomValues(arr);
 document.getElementById('out').textContent=[...arr].map(x=>chars[x%chars.length]).join('');}
function copy(){navigator.clipboard.writeText(document.getElementById('out').textContent);}
gen();
</script>
</body>
</html>
