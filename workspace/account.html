<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07111f"><title>Account Dashboard | KENJI AI Workspace"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101d31;--panel2:#14243b;--line:rgba(160,190,225,.16);--text:#f3f7ff;--muted:#9aabc4;--cyan:#62e6f5;--green:#69e3b1;--purple:#b69aff}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}body{margin:0;background:radial-gradient(circle at 18% 0%,rgba(46,190,220,.10),transparent 34rem),var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}.layout{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;padding:26px 18px;border-right:1px solid var(--line);background:rgba(8,18,32,.88);display:flex;flex-direction:column}.brand{font-weight:850;letter-spacing:.05em;font-size:1rem;padding:4px 10px 30px}.brand span{color:var(--cyan)}.nav-label{padding:10px;color:#71849f;font-size:.7rem;text-transform:uppercase;letter-spacing:.13em}.nav{display:grid;gap:6px}.nav a{padding:11px 12px;border-radius:10px;color:#b9c7d9;font-size:.9rem}.nav a:hover,.nav a.active{background:#142a40;color:#fff}.nav a.active{box-shadow:inset 2px 0 var(--cyan)}.side-bottom{margin-top:auto;display:grid;gap:10px}.side-note{padding:13px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:.78rem}.side-note strong{color:var(--green)}.main{width:min(1120px,100%);padding:30px clamp(18px,4vw,54px) 60px;margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:22px;border-bottom:1px solid var(--line)}.crumb{font-size:.82rem;color:var(--muted)}.top-actions{display:flex;gap:10px;align-items:center}.top-link{padding:9px 12px;border:1px solid var(--line);border-radius:10px;color:#cbd8e8;font-size:.82rem}.hero{padding:36px 0 25px}.eyebrow{font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--cyan)}h1{font-size:clamp(2rem,4vw,2.8rem);line-height:1.1;margin:9px 0}.muted{color:var(--muted)}.hero p{margin:9px 0 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{padding:19px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(155deg,rgba(20,36,59,.96),rgba(12,24,42,.96));min-width:0}.metric-label{font-size:.8rem;color:var(--muted)}.metric-value{font-size:1.35rem;font-weight:800;margin:7px 0 2px}.metric-help{font-size:.75rem;color:var(--muted)}.section{padding-top:36px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:14px}.section h2{font-size:1.25rem;margin:0}.section-head p{font-size:.82rem;margin:4px 0 0}.two-col{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:.82rem;color:#c7d4e5}.field input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#091526;color:var(--text)}.field input:focus{outline:2px solid rgba(98,230,245,.45);border-color:var(--cyan)}.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;padding:10px 14px;border:0;border-radius:10px;background:linear-gradient(90deg,var(--cyan),var(--purple));color:#07111f;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.btn.secondary{background:#1a3048;border:1px solid var(--line);color:#e5f1ff}.btn.danger{background:#321f2c;border:1px solid rgba(255,140,160,.25);color:#ffd5dd}.status{margin:12px 0;padding:11px 12px;border:1px solid rgba(98,230,245,.25);border-radius:10px;background:rgba(18,48,65,.35);color:#c9eaf1;font-size:.83rem}.status[hidden]{display:none}.status.error{border-color:rgba(255,130,130,.4);color:#ffd0d0}.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border:1px solid rgba(105,227,177,.3);border-radius:999px;color:var(--green);font-size:.72rem;font-weight:750}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.placeholder{min-height:130px;display:grid;align-content:center;gap:7px}.placeholder strong{font-size:.95rem}.placeholder p{margin:0;color:var(--muted);font-size:.82rem}.quick-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.quick-link{display:block;padding:17px;border:1px solid var(--line);border-radius:13px;background:#0d1a2c}.quick-link:hover{border-color:rgba(98,230,245,.5)}.quick-link strong{display:block;margin-bottom:4px}.quick-link span{font-size:.8rem;color:var(--muted)}.footer{padding-top:36px;color:#71849f;font-size:.76rem}.mobile-brand{display:none}
@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{position:relative;height:auto;padding:15px 16px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:4px 4px 12px}.nav-label,.side-bottom{display:none}.nav{display:flex;overflow:auto;padding-bottom:2px}.nav a{white-space:nowrap;padding:8px 10px}.main{padding-top:20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.topbar{align-items:flex-start;flex-direction:column}.top-actions{width:100%;flex-wrap:wrap}.hero{padding-top:28px}.grid,.two-col,.quick-links{grid-template-columns:1fr}.section{padding-top:28px}.card{padding:16px}}
</style>
<link rel="stylesheet" href="/assets/kenji-premium.css">
</head><body>
<div class="layout">
<aside class="sidebar"><a class="brand" href="/workspace/"><span>KENJI</span> AI WORKSPACE</a><div class="nav-label">Workspace</div><nav class="nav" aria-label="Account navigation"><a class="active" href="#overview">◫ &nbsp; Overview</a><a href="#profile">♙ &nbsp; My profile</a><a href="#credits">◈ &nbsp; AI Credits</a><a href="#activity">↗ &nbsp; Usage history</a><a href="#subscription">◇ &nbsp; Subscription</a><a href="#security">⌑ &nbsp; Security</a></nav><div class="side-bottom"><div class="side-note"><strong>Account secured</strong><br>Firebase Authentication<br><span id="sideEmail">Loading account…</span></div><a class="top-link" href="/workspace/">← Back to Workspace</a></div></aside>
<main class="main">
<header class="topbar"><div class="crumb">KENJI AI Workspace <span aria-hidden="true">/</span> Account</div><div class="top-actions"><a class="top-link" href="/ai-customer-reply.html">Open AI Customer Reply ↗</a><a class="top-link" href="/workspace/">Workspace home</a></div></header>
<section class="hero" id="overview"><div class="eyebrow">Account overview</div><h1>Welcome back, <span id="welcomeName">there</span>.</h1><p class="muted">Manage your profile, account security and workspace access in one place.</p></section>
<section class="grid" aria-label="Account summary">
<article class="card"><div class="metric-label">Account status</div><div class="metric-value"><span class="pill"><span class="dot"></span> Verified</span></div><div class="metric-help">Your email address is verified.</div></article>
<article class="card"><div class="metric-label">Workspace plan</div><div class="metric-value">Not assigned</div><div class="metric-help">Plans are not connected to billing yet.</div></article>
<article class="card"><div class="metric-label">AI Credits</div><div class="metric-value">Not active</div><div class="metric-help">No Credit balance is being tracked yet.</div></article>
</section>
<section class="section" id="profile"><div class="section-head"><div><h2>My profile</h2><p class="muted">View and update your display name.</p></div></div><div class="two-col">
<article class="card"><div class="field"><label for="profileName">Full name</label><input id="profileName" type="text" maxlength="80" autocomplete="name" placeholder="Your name"></div><div class="field"><label for="profileEmail">Email address</label><input id="profileEmail" type="email" readonly></div><button class="btn" id="saveProfile" type="button">Save profile</button><p id="profileMessage" class="status" role="status" aria-live="polite" hidden></p></article>
<article class="card"><div class="metric-label">Email verification</div><div class="metric-value">Verified</div><p class="muted" style="font-size:.83rem">Your email is confirmed and can be used to sign in to KENJI AI Workspace.</p><div class="pill"><span class="dot"></span> Email verified</div></article>
</div></section>
<section class="section" id="credits"><div class="section-head"><div><h2>AI Credits</h2><p class="muted">Credits will appear here when usage and billing are connected.</p></div></div><article class="card placeholder"><strong>Credit tracking is not active yet</strong><p>No balance is displayed because the Credits ledger has not been implemented. No Credits have been issued or deducted.</p><a href="/workspace/billing.html" class="top-link" style="width:max-content">View plan preview ↗</a></article></section>
<section class="section" id="activity"><div class="section-head"><div><h2>Usage history</h2><p class="muted">A record of AI requests and account activity.</p></div></div><article class="card placeholder"><strong>Usage history is not available yet</strong><p>Request tracking and a user activity database have not been connected. This section will populate after that work is completed.</p></article></section>
<section class="section" id="subscription"><div class="section-head"><div><h2>Subscription</h2><p class="muted">Manage plan and payment information.</p></div></div><div class="two-col"><article class="card"><div class="metric-label">Current plan</div><div class="metric-value">No active subscription</div><p class="muted" style="font-size:.83rem">No subscription or payment method is connected to this account.</p></article><article class="card"><div class="metric-label">Billing center</div><p class="muted" style="font-size:.83rem">The available plans are still a design preview. Checkout is disabled.</p><a href="/workspace/billing.html" class="btn secondary">View billing preview</a></article></div></section>
<section class="section" id="security"><div class="section-head"><div><h2>Security</h2><p class="muted">Manage your sign-in credentials and session.</p></div></div><div class="two-col"><article class="card"><strong>Password</strong><p class="muted" style="font-size:.83rem">Send a password reset link to your verified email address.</p><button class="btn secondary" id="resetPassword" type="button">Send password reset email</button><p id="securityMessage" class="status" role="status" aria-live="polite" hidden></p></article><article class="card"><strong>Sign out</strong><p class="muted" style="font-size:.83rem">End your current KENJI AI Workspace session on this browser.</p><button class="btn danger" id="signOutButton" type="button">Sign out</button></article></div></section>
<footer class="footer">KENJI AI Workspace · Account dashboard · Credits and billing are not active.</footer>
</main></div>
<script type="module">
import {auth,authReady,onAuthStateChanged,signOut,updateProfile,sendPasswordResetEmail,friendlyAuthError} from "./firebase-auth.js";
const $=id=>document.getElementById(id);
function show(id,text,isError=false){const el=$(id);el.textContent=text;el.hidden=false;el.classList.toggle("error",isError);}
await authReady;
onAuthStateChanged(auth,async user=>{
 if(!user){location.replace("/workspace/login.html");return;}
 if(!user.emailVerified){await signOut(auth);location.replace("/workspace/login.html");return;}
 const name=user.displayName||"";
 $("welcomeName").textContent=name||"there";
 $("profileName").value=name;
 $("profileEmail").value=user.email||"";
 $("sideEmail").textContent=user.email||"";
});
$("saveProfile").addEventListener("click",async()=>{
 const button=$("saveProfile");button.disabled=true;button.textContent="Saving…";
 try{
  const user=auth.currentUser;if(!user)throw new Error("Your session has expired. Please sign in again.");
  const name=$("profileName").value.trim();if(!name)throw new Error("Please enter your name.");
  await updateProfile(user,{displayName:name});
  $("welcomeName").textContent=name;show("profileMessage","Your profile name has been updated.");
 }catch(error){show("profileMessage",error.message&&!error.code?error.message:friendlyAuthError(error),true);}
 finally{button.disabled=false;button.textContent="Save profile";}
});
$("resetPassword").addEventListener("click",async()=>{
 const button=$("resetPassword");button.disabled=true;button.textContent="Sending…";
 try{
  const user=auth.currentUser;if(!user?.email)throw new Error("Please sign in again before requesting a password reset.");
  await sendPasswordResetEmail(auth,user.email,{url:location.origin+"/workspace/login.html",handleCodeInApp:false});
  show("securityMessage","If the address is eligible, Firebase has sent a password reset email. Check your inbox and spam folder.");
 }catch(error){show("securityMessage",error.message&&!error.code?error.message:friendlyAuthError(error),true);}
 finally{button.disabled=false;button.textContent="Send password reset email";}
});
$("signOutButton").addEventListener("click",async()=>{
 const button=$("signOutButton");button.disabled=true;button.textContent="Signing out…";
 try{await signOut(auth);location.replace("/workspace/login.html");}
 catch(error){show("securityMessage",friendlyAuthError(error),true);button.disabled=false;button.textContent="Sign out";}
});
</script><script src="/assets/kenji-motion.js" defer></script>
</body></html>
