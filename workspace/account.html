<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07111f"><title>Account | KENJI AI Workspace</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#07111f;color:#f3f7ff;font:16px/1.6 system-ui}.panel{width:min(480px,100%);padding:30px;border:1px solid #29405a;border-radius:20px;background:#101d31}a{color:#62e6f5;text-decoration:none}.muted{color:#9aabc4}.notice{margin:20px 0;padding:14px;border:1px solid #28566a;border-radius:12px;background:#122f41}.notice[hidden]{display:none}button{padding:11px 18px;border:0;border-radius:10px;background:linear-gradient(90deg,#62e6f5,#b69aff);font-weight:750;cursor:pointer}</style></head><body><main class="panel"><p><a href="/workspace/">KENJI AI WORKSPACE</a></p><h1>Your account</h1><p class="muted">Account and sign-in status</p><div id="notice" class="notice" role="status">Checking your session…</div><div id="accountDetails" hidden><p><strong>Name:</strong> <span id="displayName"></span></p><p><strong>Email:</strong> <span id="email"></span></p><p><strong>Email verified:</strong> <span id="verified"></span></p><button id="signOutButton" type="button">Sign out</button></div><p class="muted">Credits, subscriptions and payment history are not enabled yet.</p></main>
<script type="module">
import {auth,authReady,onAuthStateChanged,signOut} from "./firebase-auth.js";
const notice=document.getElementById("notice"),details=document.getElementById("accountDetails");
await authReady;
onAuthStateChanged(auth,async user=>{
 if(!user){location.replace("/workspace/login.html");return;}
 if(!user.emailVerified){await signOut(auth);location.replace("/workspace/login.html");return;}
 notice.hidden=true;details.hidden=false;
 document.getElementById("displayName").textContent=user.displayName||"—";
 document.getElementById("email").textContent=user.email||"—";
 document.getElementById("verified").textContent="Yes";
});
document.getElementById("signOutButton").addEventListener("click",async()=>{
 await signOut(auth);location.replace("/workspace/login.html");
});
</script></body></html>
