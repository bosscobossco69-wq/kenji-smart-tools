<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07111f"><title>Create account | KENJI AI Workspace</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><style>
:root{color-scheme:dark;--line:rgba(160,190,225,.17);--text:#f3f7ff;--muted:#9aabc4;--cyan:#62e6f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 5%,rgba(46,190,220,.16),transparent 32rem),linear-gradient(145deg,#07111f,#0a1425 55%,#0b1020);color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{color:var(--cyan);text-decoration:none}.wrap{width:min(480px,100%)}.brand{display:block;text-align:center;font-weight:850;letter-spacing:.08em;margin-bottom:24px}.brand span{color:var(--cyan)}.panel{padding:30px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(160deg,rgba(20,36,59,.98),rgba(12,24,42,.98));box-shadow:0 24px 80px #0005}h1{font-size:1.8rem;margin:0 0 5px}.muted{color:var(--muted)}.status{margin:20px 0;padding:14px;border-radius:12px;border:1px solid rgba(98,230,245,.28);background:rgba(18,48,65,.42);color:#c9eaf1}.status[hidden]{display:none}.status.error{border-color:rgba(255,130,130,.45);color:#ffd0d0}.status strong{color:var(--cyan)}label{display:block;margin:16px 0 7px;font-weight:650;font-size:.9rem}input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:#091526;color:var(--text);font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:linear-gradient(90deg,#62e6f5,#b69aff);color:#07111f;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.6;cursor:wait}button:hover:not(:disabled){filter:brightness(1.06)}.links{display:flex;justify-content:space-between;gap:12px;margin-top:22px;font-size:.88rem}small{display:block;margin-top:16px;color:var(--muted);font-size:.8rem}.foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:22px}</style></head>
<body><main class="wrap"><a class="brand" href="/workspace/"><span>KENJI</span> AI WORKSPACE</a><section class="panel"><h1>Create your account</h1><p class="muted">Set up access to your AI workspace.</p><p id="formMessage" class="status" role="status" aria-live="polite" hidden></p><form id="signupForm"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" maxlength="80" required placeholder="Your name"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required placeholder="you@example.com"><label for="password">Create password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required placeholder="At least 6 characters"><button type="submit" id="submitButton">Create account</button></form><small>We will create your account with Firebase Authentication and send a verification email. Do not reuse a password from another service.</small><div class="links"><a href="/workspace/">← Workspace</a><a href="/workspace/login.html">Already have an account? Sign in</a></div></section><div class="foot">KENJI AI Workspace · Early access</div></main>
<script type="module">
import {auth,authReady,createUserWithEmailAndPassword,updateProfile,sendEmailVerification,signOut,friendlyAuthError} from "./firebase-auth.js";
const form=document.getElementById("signupForm"),button=document.getElementById("submitButton"),message=document.getElementById("formMessage");
function showMessage(text,isError=false){message.textContent=text;message.hidden=false;message.classList.toggle("error",isError);}
form.addEventListener("submit",async event=>{
 event.preventDefault();button.disabled=true;button.textContent="Creating account…";message.hidden=true;
 try{
  await authReady;
  const name=document.getElementById("name").value.trim();
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  if(!name){throw new Error("Please enter your name.");}
  const credential=await createUserWithEmailAndPassword(auth,email,password);
  await updateProfile(credential.user,{displayName:name});
  await sendEmailVerification(credential.user,{url:location.origin+"/workspace/login.html",handleCodeInApp:false});
  await signOut(auth);
  form.reset();
  showMessage("Your account has been created. Check your inbox and verify your email before signing in. If you do not see the message, check your spam folder.");
 }catch(error){showMessage(error.message && !error.code ? error.message : friendlyAuthError(error),true);}
 finally{button.disabled=false;button.textContent="Create account";}
});
</script></body></html>
