<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Billing review | KENJI</title>
<style>body{font:16px/1.55 system-ui,sans-serif;background:#17120e;color:#f4e7d2;margin:0;padding:24px}main{max-width:760px;margin:auto}h1{font-size:1.7rem}button{background:#d6b88c;color:#17120e;border:0;border-radius:10px;padding:12px 16px;font-weight:700}a{color:#e5c798}section{border:1px solid #665443;border-radius:12px;padding:15px;margin:16px 0;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #665443;text-align:left;padding:7px}small{color:#bbb}#status{white-space:pre-wrap}</style></head>
<body><main><p><a href="/workspace/billing.html">← Billing center</a></p><h1>Historical billing review (read-only)</h1><p>This page does not modify Credits, Stripe payments or approval state. Only your own account records are shown.</p><button id="inspect">Inspect my billing records</button><p id="status" role="status">Sign in with your existing account to inspect.</p><div id="result"></div></main>
<script type="module">
import {auth,authReady,onAuthStateChanged} from "./firebase-auth.js";
let user=null;await authReady;onAuthStateChanged(auth,u=>{user=u;document.getElementById("status").textContent=u?"Signed in. Press Inspect.":"Sign in first at /workspace/login.html";});
const el=document.getElementById("result"),status=document.getElementById("status");
function node(tag,text){const n=document.createElement(tag);n.textContent=String(text??"—");return n;}
document.getElementById("inspect").addEventListener("click",async()=>{
 el.replaceChildren();if(!user){location.href="/workspace/login.html";return;}
 if(!user.emailVerified){status.textContent="Verify your email before inspection.";return;}
 status.textContent="Checking records...";
 try{
 const token=await user.getIdToken(true);
 const r=await fetch("/api/billing-audit",{headers:{Authorization:"Bearer "+token},cache:"no-store"});
 const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");
 const section=node("section","");const summary=node("div","Old balance: "+d.oldBalance+" | Old checkout: "+d.oldCheckoutMode+" | Live account exists: "+d.liveBillingExists+" | Legacy review completed: "+d.legacyReviewComplete);
 section.append(summary);section.append(node("p","Ledger records displayed: "+d.ledgerCountReturned+(d.ledgerPossiblyTruncated?" (more records may exist)":"")));
 const table=document.createElement("table"),head=document.createElement("tr");
 ["Record type","Credits","Checkout mode","Status"].forEach(v=>head.append(node("th",v)));table.append(head);
 for(const row of d.ledger){const tr=document.createElement("tr");[row.kind,row.credits,row.sourceMode,row.status].forEach(v=>tr.append(node("td",v)));table.append(tr);}
 section.append(table);section.append(node("p",d.warning));el.append(section);
 status.textContent="Inspection complete. Unknown and live-unverified entries require separate payment checks. Do not approve migration from this screen.";
 }catch(err){status.textContent=err.message||"Inspection failed";}
});
</script></body></html>
