te(-9)"><rect width="116" height="93" rx="13" fill="url(#glass)" stroke="#b2b7ad"/><path d="M25 73V52h15v21zm25 0V37h15v36zm25 0V20h15v53z" fill="url(#gold)"/></g><g transform="translate(125 58) rotate(-8 115 115)"><rect x="8" y="8" width="206" height="222" rx="32" fill="#081a20" stroke="#bda77e"/><rect width="206" height="222" rx="32" fill="url(#glass)" stroke="#e4e4d9" stroke-width="1.6"/><rect x="5" y="5" width="196" height="212" rx="27" fill="none" stroke="#c7d4d5" stroke-opacity=".4"/><path d="M62 54h34l-12 64 62-64h42l-67 66 40 63h-40l-38-58-11 58H38z" transform="translate(0 -3)" fill="#10232b" opacity=".7"/><path d="M62 49h34l-12 64 62-64h42l-67 66 40 63h-40l-38-58-11 58H38z" fill="url(#gold)"/><path d="M18 178q0 30 33 30h121" fill="none" stroke="#ffe2a2" stroke-width="3" stroke-linecap="round" opacity=".85"/></g><g transform="translate(392 220)"><rect width="78" height="64" rx="13" fill="url(#glass)" stroke="#aab9b5"/><path d="M22 43h34a12 12 0 0 0 0-24 18 18 0 0 0-33 3 11 11 0 0 0-1 21z" fill="none" stroke="#e2cfac" stroke-width="2.3"/></g></svg><div class="feature-strip"><span><b>01</b> 智能效率</span><span><b>02</b> 统一工作空间</span><span><b>03</b> 实用工具</span></div></aside><section class="panel"><nav class="auth-language" aria-label="语言"><details><summary>简体中文</summary><div class="language-options"><a href="/workspace/signup.html" lang="en" hreflang="en">English</a><a href="/workspace/signup.zh-CN.html" lang="zh-CN" hreflang="zh-CN" aria-current="page">简体中文</a><a href="/workspace/signup.zh-TW.html" lang="zh-TW" hreflang="zh-TW">繁體中文</a><a href="/workspace/signup.th.html" lang="th" hreflang="th">ไทย</a><a href="/workspace/signup.es.html" lang="es" hreflang="es">Español</a><a href="/workspace/signup.ms.html" lang="ms" hreflang="ms">Bahasa Melayu</a></div></details></nav><h1>创建账户</h1><p class="muted">开启你的智能数字工作空间。</p><p id="formMessage" class="status" role="status" aria-live="polite" hidden></p><button id="googleButton" type="button" class="google-login"><svg aria-hidden="true" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.28 5.48-4.8 7.18l7.73 6C44.38 38.03 46.98 31.86 46.98 24.55z"/><path fill="#FBBC05" d="M10.53 28.59A14.51 14.51 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.2A23.83 23.83 0 0 0 0 24c0 3.87.93 7.51 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.17 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>使用 Google 继续</button><div class="google-divider">或使用电子邮件继续</div><form id="signupForm"><label for="name">姓名</label><input id="name" name="name" autocomplete="name" maxlength="80" required placeholder="输入姓名"><label for="email">电子邮箱</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required placeholder="you@example.com"><label for="password">创建密码</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required placeholder="至少 6 个字符"><button type="button" id="passwordToggle" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><label style="display:flex;align-items:flex-start;gap:10px;font-weight:400;line-height:1.45"><input type="checkbox" id="marketingConsent" style="width:18px;height:18px;flex:none;margin-top:4px"><span>通过邮件接收不定期的产品技巧与优惠。自愿订阅，可随时退订。</span></label><button type="submit" id="submitButton">创建账户</button></form><small>我们将通过 Firebase Authentication 创建账户并发送验证邮件。请勿使用其他服务的相同密码。</small><div class="links"><a href="/workspace/">← 工作空间</a><a href="/workspace/login.zh-CN.html">已有账户？登录</a></div></section><div class="foot">KENJI Smart Tools</div></main>
<script>document.getElementById("passwordToggle").addEventListener("click",function(){const p=document.getElementById("password");const visible=p.type==="password";p.type=visible?"text":"password";this.setAttribute("aria-pressed",String(visible));this.setAttribute("aria-label",visible?"隐藏密码":"显示密码");});</script>
<script type="module">
import {auth,authReady,createUserWithEmailAndPassword,updateProfile,sendEmailVerification,signOut,GoogleAuthProvider,signInWithPopup,reload,friendlyAuthError as originalAuthError} from "./firebase-auth.js";
const localizedErrors={"auth/invalid-credential":"邮箱或密码不正确。","auth/user-not-found":"邮箱或密码不正确。","auth/wrong-password":"邮箱或密码不正确。","auth/missing-password":"邮箱或密码不正确。","auth/email-already-in-use":"该邮箱可能已有账户，请登录或重置密码。","auth/invalid-email":"请输入有效邮箱。","auth/weak-password":"密码至少需要 6 个字符。","auth/too-many-requests":"请求过多，请稍后重试。","auth/network-request-failed":"网络错误，请检查连接。","auth/popup-closed-by-user":"Google 登录窗口已关闭，请重试。","auth/cancelled-popup-request":"Google 登录窗口已关闭，请重试。","auth/popup-blocked":"浏览器阻止了弹窗，请允许弹窗或使用 Safari、Chrome。","auth/operation-not-allowed":"当前登录方式或域名未获授权，请联系支持。","auth/unauthorized-domain":"当前登录方式或域名未获授权，请联系支持。","auth/unauthorized-continue-uri":"当前登录方式或域名未获授权，请联系支持。","auth/user-disabled":"此账户已停用，请联系支持。","auth/account-exists-with-different-credential":"此邮箱已有其他登录方式，请使用原登录方式。"};
function friendlyAuthError(error){return localizedErrors[error?.code] || "操作未完成，请重试。";}

const form=document.getElementById("signupForm"),button=document.getElementById("submitButton"),message=document.getElementById("formMessage"),googleButton=document.getElementById("googleButton");
window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments);};
function track(eventName,reason){
  // No email, password, name, Firebase UID, or freeform error messages are sent.
  const data=reason?{reason}:{source:"signup_page"};
  window.va("event",{name:eventName,data});
}
function countFunnel(event){
  // Optional analytics; failures never block Firebase signup or leak form details.
  fetch("/api/website-order?action=conversion_event",{method:"POST",credentials:"same-origin",keepalive:true,
    headers:{"Content-Type":"application/json"},body:JSON.stringify({event})}).catch(()=>{});
}
authReady.then(()=>{
  // Signed-in users (including the site administrator) are not included.
  if(!auth.currentUser)countFunnel("signup_page");
}).catch(()=>{});
function showMessage(text,isError=false){message.textContent=text;message.hidden=false;message.classList.toggle("error",isError);}
googleButton.addEventListener("click",async()=>{
 googleButton.disabled=true;googleButton.setAttribute("aria-busy","true");showMessage("正在打开 Google 安全登录…");
 try{
  await authReady;
  const credential=await signInWithPopup(auth,new GoogleAuthProvider());
  await reload(credential.user);
  if(!credential.user.emailVerified){await signOut(auth);showMessage("Google 未确认已验证的邮箱，请使用邮箱验证。",true);return;}
  track("Signup Google Authenticated");
  location.assign("/workspace/account.html");
 }catch(error){showMessage(friendlyAuthError(error),true);}
 finally{googleButton.disabled=false;googleButton.removeAttribute("aria-busy");}
});
form.addEventListener("submit",async event=>{
 event.preventDefault();button.disabled=true;button.textContent="正在创建账户…";message.hidden=true;
 track("Signup Submitted");
 if(!auth.currentUser)countFunnel("signup_submit");
 try{
  await authReady;
  const name=document.getElementById("name").value.trim();
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const marketingConsent=document.getElementById("marketingConsent").checked;
  if(!name){throw new Error("请输入姓名。");}
  const credential=await createUserWithEmailAndPassword(auth,email,password);
  await updateProfile(credential.user,{displayName:name});
  await sendEmailVerification(credential.user,{url:location.origin+"/workspace/login.zh-CN.html",handleCodeInApp:false});
  // Consent is recorded only against the authenticated new Firebase UID.
  // Failure is fail-closed: no consent record means no promotional messages.
  try {
    const idToken=await credential.user.getIdToken();
    const resp=await fetch("/api/account-billing?action=marketing_preference",{
      method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+idToken},
      body:JSON.stringify({marketingConsent})
    });
    if(!resp.ok)console.warn("Marketing preference was not saved; no marketing is enabled.");
  }catch{console.warn("Marketing preference unavailable; no marketing is enabled.");}
  track("Signup Account Created");
  await signOut(auth);
  form.reset();
  showMessage("账户已创建。请在登录前验证邮箱；若未收到邮件，请检查垃圾邮件。");
 }catch(error){
  const known=new Set(["auth/email-already-in-use","auth/invalid-email","auth/weak-password","auth/network-request-failed","auth/too-many-requests","auth/operation-not-allowed","auth/unauthorized-domain"]);
  track("Signup Failed",known.has(error.code)?error.code:"other");
  // Only non-credential validation failures are anonymous aggregate counts.
  if(!auth.currentUser)countFunnel("signup_error");
  showMessage(error.message === "请输入姓名。" ? error.message : friendlyAuthError(error),true);
 }
 finally{button.disabled=false;button.textContent="创建账户";}
});
</script><script src="/assets/kenji-motion.js" defer></script>
