<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07111f"><title>Reset password | KENJI AI Workspace</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 5%,rgba(46,190,220,.16),transparent 32rem),linear-gradient(145deg,#07111f,#0a1425 55%,#0b1020);color:#f3f7ff;font:15px/1.55 system-ui}.panel{width:min(460px,100%);padding:30px;border:1px solid rgba(160,190,225,.17);border-radius:22px;background:#101d31}a{color:#62e6f5;text-decoration:none}.muted{color:#9aabc4}label{display:block;margin:18px 0 7px;font-weight:650}input{width:100%;padding:13px;border:1px solid rgba(160,190,225,.2);border-radius:11px;background:#091526;color:#f3f7ff;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:linear-gradient(90deg,#62e6f5,#b69aff);font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.6}.status{margin:20px 0;padding:13px;border:1px solid rgba(98,230,245,.28);border-radius:12px;background:rgba(18,48,65,.42);color:#c9eaf1}.status[hidden]{display:none}.status.error{border-color:rgba(255,130,130,.45);color:#ffd0d0}</style>
<link rel="stylesheet" href="/assets/kenji-premium.css">
  <link rel="stylesheet" href="/assets/kenji-brand-system.css">
</head><body><main class="panel"><p><a href="/workspace/">KENJI AI WORKSPACE</a></p><h1>Reset your password</h1><p class="muted">Enter your account email and we will send a reset link if an account matches.</p><p id="message" class="status" role="status" aria-live="polite" hidden></p><form id="resetForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><button id="submitButton" type="submit">Send reset email</button></form><p class="muted"><a href="/workspace/login.html">Back to sign in</a></p></main>
<script type="module">
import {auth,authReady,sendPasswordResetEmail,friendlyAuthError} from "./firebase-auth.js";
const form=document.getElementById("resetForm"),button=document.getElementById("submitButton"),message=document.getElementById("message");
form.addEventListener("submit",async event=>{
 event.preventDefault();button.disabled=true;button.textContent="Sending…";message.hidden=true;
 try{
  await authReady;
  await sendPasswordResetEmail(auth,document.getElementById("email").value.trim(),{url:location.origin+"/workspace/login.html",handleCodeInApp:false});
  message.textContent="If an account matches that address, a password reset email has been sent. Check your inbox and spam folder.";message.hidden=false;form.reset();
 }catch(error){message.textContent=friendlyAuthError(error);message.classList.add("error");message.hidden=false;}
 finally{button.disabled=false;button.textContent="Send reset email";}
});
</script><script src="/assets/kenji-motion.js" defer></script>
<script src="/assets/kenji-theme.js" defer></script>
</body></html>
