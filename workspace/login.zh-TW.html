te(-9)"><rect width="116" height="93" rx="13" fill="url(#glass)" stroke="#b2b7ad"/><path d="M25 73V52h15v21zm25 0V37h15v36zm25 0V20h15v53z" fill="url(#gold)"/></g><g transform="translate(125 58) rotate(-8 115 115)"><rect x="8" y="8" width="206" height="222" rx="32" fill="#081a20" stroke="#bda77e"/><rect width="206" height="222" rx="32" fill="url(#glass)" stroke="#e4e4d9" stroke-width="1.6"/><rect x="5" y="5" width="196" height="212" rx="27" fill="none" stroke="#c7d4d5" stroke-opacity=".4"/><path d="M62 54h34l-12 64 62-64h42l-67 66 40 63h-40l-38-58-11 58H38z" transform="translate(0 -3)" fill="#10232b" opacity=".7"/><path d="M62 49h34l-12 64 62-64h42l-67 66 40 63h-40l-38-58-11 58H38z" fill="url(#gold)"/><path d="M18 178q0 30 33 30h121" fill="none" stroke="#ffe2a2" stroke-width="3" stroke-linecap="round" opacity=".85"/></g><g transform="translate(392 220)"><rect width="78" height="64" rx="13" fill="url(#glass)" stroke="#aab9b5"/><path d="M22 43h34a12 12 0 0 0 0-24 18 18 0 0 0-33 3 11 11 0 0 0-1 21z" fill="none" stroke="#e2cfac" stroke-width="2.3"/></g></svg><div class="feature-strip"><span><b>01</b> 智慧效率</span><span><b>02</b> 統一工作空間</span><span><b>03</b> 實用工具</span></div></aside><section class="panel" aria-labelledby="title"><nav class="auth-language" aria-label="語言"><details><summary>繁體中文</summary><div class="language-options"><a href="/workspace/login.html" lang="en" hreflang="en">English</a><a href="/workspace/login.zh-CN.html" lang="zh-CN" hreflang="zh-CN">简体中文</a><a href="/workspace/login.zh-TW.html" lang="zh-TW" hreflang="zh-TW" aria-current="page">繁體中文</a><a href="/workspace/login.th.html" lang="th" hreflang="th">ไทย</a><a href="/workspace/login.es.html" lang="es" hreflang="es">Español</a><a href="/workspace/login.ms.html" lang="ms" hreflang="ms">Bahasa Melayu</a></div></details></nav><h1 id="title">歡迎回來</h1><p class="muted">登入你的工作空間。</p><p id="formMessage" class="status" role="status" aria-live="polite" hidden></p><button id="googleButton" type="button" class="google-login"><svg aria-hidden="true" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.28 5.48-4.8 7.18l7.73 6C44.38 38.03 46.98 31.86 46.98 24.55z"/><path fill="#FBBC05" d="M10.53 28.59A14.51 14.51 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.2A23.83 23.83 0 0 0 0 24c0 3.87.93 7.51 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.17 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>使用 Google 繼續</button><div class="google-divider">或使用電子郵件繼續</div><form id="loginForm"><label for="email">電子郵件</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="password">密碼</label><div class="password-field"><input id="password" type="password" autocomplete="current-password" required placeholder="輸入密碼"><button type="button" id="passwordToggle" aria-label="顯示密碼" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><button type="submit" id="submitButton">登入</button></form><button type="button" id="resendButton" hidden>重新傳送驗證郵件</button><div class="links"><a href="/workspace/">← 工作空間</a><a href="/workspace/forgot-password.zh-TW.html">忘記密碼？</a></div><p class="muted" style="margin-top:18px;text-align:center">新用戶？ <a href="/workspace/signup.zh-TW.html">建立帳戶</a></p></section><div class="foot">KENJI Smart Tools</div></main>
<script>document.getElementById("passwordToggle").addEventListener("click",function(){const p=document.getElementById("password");const visible=p.type==="password";p.type=visible?"text":"password";this.setAttribute("aria-pressed",String(visible));this.setAttribute("aria-label",visible?"隱藏密碼":"顯示密碼");});</script>
<script type="module">
import {auth,authReady,onAuthStateChanged,signInWithEmailAnd密碼,sendEmailVerification,signOut,reload,GoogleAuthProvider,signInWithPopup,friendlyAuthError as originalAuthError} from "./firebase-auth.js";
const localizedErrors={"auth/invalid-credential":"電子郵件或密碼不正確。","auth/user-not-found":"電子郵件或密碼不正確。","auth/wrong-password":"電子郵件或密碼不正確。","auth/missing-password":"電子郵件或密碼不正確。","auth/email-already-in-use":"此電子郵件可能已有帳戶，請登入或重設密碼。","auth/invalid-email":"請輸入有效電子郵件。","auth/weak-password":"密碼至少需要 6 個字元。","auth/too-many-requests":"要求過多，請稍後重試。","auth/network-request-failed":"網路錯誤，請檢查連線。","auth/popup-closed-by-user":"Google 登入視窗已關閉，請重試。","auth/cancelled-popup-request":"Google 登入視窗已關閉，請重試。","auth/popup-blocked":"瀏覽器阻擋了彈出視窗，請允許彈出視窗或使用 Safari、Chrome。","auth/operation-not-allowed":"目前登入方式或網域未獲授權，請聯絡支援。","auth/unauthorized-domain":"目前登入方式或網域未獲授權，請聯絡支援。","auth/unauthorized-continue-uri":"目前登入方式或網域未獲授權，請聯絡支援。","auth/user-disabled":"此帳戶已停用，請聯絡支援。","auth/account-exists-with-different-credential":"此電子郵件已有其他登入方式，請使用原登入方式。"};
function friendlyAuthError(error){return localizedErrors[error?.code] || "操作未完成，請重試。";}

const form=document.getElementById("loginForm"),button=document.getElementById("submitButton"),message=document.getElementById("formMessage"),resend=document.getElementById("resendButton");
let unverifiedUser=null;
const googleButton=document.getElementById("googleButton");
await authReady;
onAuthStateChanged(auth,user=>{
 if(user && user.emailVerified){
  message.textContent="你已登入，正在開啟帳戶…";
  message.hidden=false;
  location.replace("/workspace/account.html");
 }
});
function showMessage(text,isError=false){message.textContent=text;message.hidden=false;message.classList.toggle("error",isError);}
form.addEventListener("submit",async event=>{
 event.preventDefault();button.disabled=true;button.textContent="正在登入…";resend.hidden=true;message.hidden=true;unverifiedUser=null;
 try{
  await authReady;
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const credential=await signInWithEmailAnd密碼(auth,email,password);
  await reload(credential.user);
  if(!credential.user.emailVerified){
   unverifiedUser=credential.user;await signOut(auth);
   showMessage("請先驗證電子郵件。查看收件匣，或重新索取驗證郵件。",true);
   resend.hidden=false;return;
  }
  location.href="/workspace/account.html";
 }catch(error){showMessage(friendlyAuthError(error),true);}
 finally{button.disabled=false;button.textContent="登入";}
});
googleButton.addEventListener("click",async()=>{
 googleButton.disabled=true;googleButton.setAttribute("aria-busy","true");showMessage("正在開啟 Google 安全登入…");
 try{
  await authReady;
  const credential=await signInWithPopup(auth,new GoogleAuthProvider());
  await reload(credential.user);
  if(!credential.user.emailVerified){await signOut(auth);showMessage("Google 未確認已驗證的電子郵件，請使用電子郵件驗證。",true);return;}
  location.assign("/workspace/account.html");
 }catch(error){showMessage(friendlyAuthError(error),true);}
 finally{googleButton.disabled=false;googleButton.removeAttribute("aria-busy");}
});
resend.addEventListener("click",async()=>{
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 resend.disabled=true;
 try{
  await authReady;
  const credential=await signInWithEmailAnd密碼(auth,email,password);
  await reload(credential.user);
  if(credential.user.emailVerified){await signOut(auth);showMessage("你的電子郵件已驗證，現在可以登入。");resend.hidden=true;return;}
  await sendEmailVerification(credential.user,{url:location.origin+"/workspace/login.zh-TW.html",handleCodeInApp:false});
  await signOut(auth);showMessage("新的驗證郵件已傳送，請查看收件匣及垃圾郵件。");
 }catch(error){showMessage(friendlyAuthError(error),true);}
 finally{resend.disabled=false;}
});
</script><script src="/assets/kenji-motion.js" defer></script>
