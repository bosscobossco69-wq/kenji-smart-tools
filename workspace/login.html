<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07111f"><title>Sign in | KENJI AI Workspace</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><style>
:root{color-scheme:dark;--line:rgba(160,190,225,.17);--text:#f3f7ff;--muted:#9aabc4;--cyan:#62e6f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 5%,rgba(46,190,220,.16),transparent 32rem),linear-gradient(145deg,#07111f,#0a1425 55%,#0b1020);color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{color:var(--cyan);text-decoration:none}.wrap{width:min(460px,100%)}.brand{display:block;text-align:center;font-weight:850;letter-spacing:.08em;margin-bottom:24px}.brand span{color:var(--cyan)}.panel{padding:30px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(160deg,rgba(20,36,59,.98),rgba(12,24,42,.98));box-shadow:0 24px 80px #0005}h1{font-size:1.8rem;margin:0 0 5px}.muted{color:var(--muted)}.status{margin:20px 0;padding:13px 14px;border-radius:12px;border:1px solid rgba(98,230,245,.28);background:rgba(18,48,65,.42);color:#c9eaf1;font-size:.9rem}.status[hidden]{display:none}.status.error{border-color:rgba(255,130,130,.45);color:#ffd0d0}label{display:block;margin:17px 0 7px;font-weight:650;font-size:.9rem}input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:#091526;color:var(--text);font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:linear-gradient(90deg,#62e6f5,#b69aff);color:#07111f;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.6;cursor:wait}button:hover:not(:disabled){filter:brightness(1.06)}.links{display:flex;justify-content:space-between;gap:12px;margin-top:22px;font-size:.88rem}.foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:22px}</style>
<link rel="stylesheet" href="/assets/kenji-premium.css">
  <link rel="stylesheet" href="/assets/kenji-brand-system.css">
</head>
<body><main class="wrap"><a class="brand" href="/workspace/"><span>KENJI</span> AI WORKSPACE</a><section class="panel" aria-labelledby="title"><h1 id="title">Welcome back</h1><p class="muted">Sign in to access your workspace.</p><p id="formMessage" class="status" role="status" aria-live="polite" hidden></p><form id="loginForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Your password"><button type="submit" id="submitButton">Sign in</button></form><button type="button" id="resendButton" hidden>Resend verification email</button><div class="links"><a href="/workspace/">← Workspace</a><a href="/workspace/forgot-password.html">Forgot password?</a></div><p class="muted" style="margin-top:18px;text-align:center">New here? <a href="/workspace/signup.html">Create an account</a></p></section><div class="foot">KENJI AI Workspace · Early access</div></main>
<script type="module">
import {auth,authReady,signInWithEmailAndPassword,sendEmailVerification,signOut,reload,friendlyAuthError} from "./firebase-auth.js";
const form=document.getElementById("loginForm"),button=document.getElementById("submitButton"),message=document.getElementById("formMessage"),resend=document.getElementById("resendButton");
let unverifiedUser=null;
function showMessage(text,isError=false){message.textContent=text;message.hidden=false;message.classList.toggle("error",isError);}
form.addEventListener("submit",async event=>{
 event.preventDefault();button.disabled=true;button.textContent="Signing in…";resend.hidden=true;message.hidden=true;unverifiedUser=null;
 try{
  await authReady;
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const credential=await signInWithEmailAndPassword(auth,email,password);
  await reload(credential.user);
  if(!credential.user.emailVerified){
   unverifiedUser=credential.user;await signOut(auth);
   showMessage("Please verify your email address before signing in. Check your inbox or request another verification email.",true);
   resend.hidden=false;return;
  }
  location.href="/workspace/account.html";
 }catch(error){showMessage(friendlyAuthError(error),true);}
 finally{button.disabled=false;button.textContent="Sign in";}
});
resend.addEventListener("click",async()=>{
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 resend.disabled=true;
 try{
  await authReady;
  const credential=await signInWithEmailAndPassword(auth,email,password);
  await reload(credential.user);
  if(credential.user.emailVerified){await signOut(auth);showMessage("Your email is already verified. You can sign in now.");resend.hidden=true;return;}
  await sendEmailVerification(credential.user,{url:location.origin+"/workspace/login.html",handleCodeInApp:false});
  await signOut(auth);showMessage("A new verification email has been sent. Check your inbox and spam folder.");
 }catch(error){showMessage(friendlyAuthError(error),true);}
 finally{resend.disabled=false;}
});
</script><script src="/assets/kenji-motion.js" defer></script>

</body></html>
