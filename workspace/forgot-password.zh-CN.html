rm id="resetForm"><label for="email">电子邮箱</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><button id="submitButton" type="submit">发送重置邮件</button></form><p class="muted"><a href="/workspace/login.zh-CN.html">返回登录</a></p></section><div class="foot">KENJI Smart Tools</div></main>
<script type="module">
import {auth,authReady,sendPasswordResetEmail,friendlyAuthError as originalAuthError} from "./firebase-auth.js";
const localizedErrors={"auth/invalid-credential":"邮箱或密码不正确。","auth/user-not-found":"邮箱或密码不正确。","auth/wrong-password":"邮箱或密码不正确。","auth/missing-password":"邮箱或密码不正确。","auth/email-already-in-use":"该邮箱可能已有账户，请登录或重置密码。","auth/invalid-email":"请输入有效邮箱。","auth/weak-password":"密码至少需要 6 个字符。","auth/too-many-requests":"请求过多，请稍后重试。","auth/network-request-failed":"网络错误，请检查连接。","auth/popup-closed-by-user":"Google 登录窗口已关闭，请重试。","auth/cancelled-popup-request":"Google 登录窗口已关闭，请重试。","auth/popup-blocked":"浏览器阻止了弹窗，请允许弹窗或使用 Safari、Chrome。","auth/operation-not-allowed":"当前登录方式或域名未获授权，请联系支持。","auth/unauthorized-domain":"当前登录方式或域名未获授权，请联系支持。","auth/unauthorized-continue-uri":"当前登录方式或域名未获授权，请联系支持。","auth/user-disabled":"此账户已停用，请联系支持。","auth/account-exists-with-different-credential":"此邮箱已有其他登录方式，请使用原登录方式。"};
function friendlyAuthError(error){return localizedErrors[error?.code] || "操作未完成，请重试。";}

const form=document.getElementById("resetForm"),button=document.getElementById("submitButton"),message=document.getElementById("message");
form.addEventListener("submit",async event=>{
 event.preventDefault();button.disabled=true;button.textContent="正在发送…";message.hidden=true;
 try{
  await authReady;
  await sendPasswordResetEmail(auth,document.getElementById("email").value.trim(),{url:location.origin+"/workspace/login.zh-CN.html",handleCodeInApp:false});
  message.textContent="若存在匹配账户，密码重置邮件已发送。请检查收件箱及垃圾邮件。";message.hidden=false;form.reset();
 }catch(error){message.textContent=friendlyAuthError(error);message.classList.add("error");message.hidden=false;}
 finally{button.disabled=false;button.textContent="发送重置邮件";}
});
</script><script src="/assets/kenji-motion.js" defer></script>
