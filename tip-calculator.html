<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tip Calculator - Split Bill & Tip | KENJI Smart Tools</title>
<meta name="description" content="Free tip calculator: enter your bill, choose a tip percentage, and split between any number of people. Instant per-person totals.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f6f7fb;color:#1a1d29;line-height:1.6}
header{background:#fff;border-bottom:1px solid #e5e7f0;padding:14px 20px}
header a{color:#4f46e5;text-decoration:none;font-weight:700}
main{max-width:720px;margin:32px auto;padding:0 16px}
h1{font-size:26px;margin-bottom:8px}
.sub{color:#5b6070;margin-bottom:24px}
.card{background:#fff;border:1px solid #e5e7f0;border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 1px 3px rgba(20,20,60,.05)}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d4d8e6;border-radius:8px;font-size:15px}
textarea{min-height:120px;resize:vertical;font-family:inherit}
button{background:#4f46e5;color:#fff;border:none;padding:11px 20px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:16px}
button:hover{background:#4338ca}
.result{background:#f0f1fa;border-radius:8px;padding:14px;margin-top:16px;font-size:16px;word-break:break-word}
.result b{font-size:20px;color:#4f46e5}
.row{display:flex;gap:12px}.row>div{flex:1}
footer{text-align:center;color:#8a8fa3;font-size:13px;padding:24px 16px}
</style>
</head>
<body>
<header><a href="/">KENJI Smart Tools</a></header>
<main>
<h1>Tip Calculator</h1>
<p class="sub">Calculate tip and split the bill between any number of people.</p>

<div class="card">
  <label>Bill amount ($)</label>
  <input type="number" id="bill" value="100" min="0" step="0.01">
  <div class="row">
    <div><label>Tip %</label>
      <select id="tip"><option value="10">10%</option><option value="15" selected>15%</option>
      <option value="18">18%</option><option value="20">20%</option><option value="25">25%</option></select>
    </div>
    <div><label>Split between (people)</label><input type="number" id="ppl" value="2" min="1"></div>
  </div>
  <button onclick="calc()">Calculate</button>
  <div class="result">Tip amount: <b id="tipout">$0.00</b></div>
  <div class="result">Total: <b id="total">$0.00</b></div>
  <div class="result">Each person pays: <b id="each">$0.00</b></div>
</div>

</main>
<footer>&copy; 2026 KENJI Smart Tools &middot; <a href="/">All tools</a> &middot; Free, no account needed</footer>
<script>
function calc(){const b=+document.getElementById('bill').value||0,t=+document.getElementById('tip').value,
 p=Math.max(1,+document.getElementById('ppl').value||1),tip=b*t/100;
 const f=x=>'$'+x.toFixed(2);
 document.getElementById('tipout').textContent=f(tip);
 document.getElementById('total').textContent=f(b+tip);
 document.getElementById('each').textContent=f((b+tip)/p);}
calc();
</script>
</body>
</html>
