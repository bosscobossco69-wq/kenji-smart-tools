name: Stripe Sandbox Safety Tests

on:
  pull_request:
    branches:
      - feature/kenji-ai-workspace-foundation
  push:
    branches:
      - feature/stripe-sandbox-integration-preview

permissions:
  contents: read

jobs:
  node-tests:
    name: Node.js tests (no payment credentials)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit and Firestore Emulator integration tests
        run: npx --yes firebase-tools@latest emulators:exec --project demo-kenji-sandbox --only firestore "FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 FIREBASE_PROJECT_ID=demo-kenji-sandbox npm test"
