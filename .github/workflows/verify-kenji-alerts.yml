name: Verify KENJI billing and admin email alerts
on:
  pull_request:
    paths:
      - 'api/**'
      - 'lib/**'
      - 'tests/**'
      - 'package.json'
      - 'vercel.json'
      - 'customer-dashboard.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm run test:billing
      - run: npm run test:notifications
      - run: npm run test:marketing
      - run: node --test tests/admin-dashboard-ui.test.cjs
      - run: node --test tests/business-inventory.test.mjs
      - name: Check marketing and consent API syntax
        run: |
          node --check api/account-billing.js
          node --check api/website-order.js
          node --check lib/marketing-consent.js
          node --check lib/marketing-followups.js
